<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="760" height="700" viewBox="0 0 760 700">

  <defs>
    <style>
      @keyframes strobe-blue   { 0%,100%{stroke:#3b82f6} 50%{stroke:#93c5fd} }
      @keyframes strobe-purple { 0%,100%{stroke:#7c3aed} 50%{stroke:#c4b5fd} }
      @keyframes strobe-orange { 0%,100%{stroke:#ea580c} 50%{stroke:#fdba74} }
      @keyframes strobe-green  { 0%,100%{stroke:#15803d} 50%{stroke:#86efac} }
      @keyframes strobe-red    { 0%,100%{stroke:#dc2626} 50%{stroke:#fca5a5} }
      @keyframes strobe-teal   { 0%,100%{stroke:#0e7490} 50%{stroke:#67e8f9} }

      .n0 { fill:#0c1929; stroke:#3b82f6; stroke-width:1.5; animation:strobe-blue   2.4s ease-in-out infinite; }
      .n1 { fill:#13073a; stroke:#7c3aed; stroke-width:1.5; animation:strobe-purple 2.4s ease-in-out infinite 0.4s; }
      .n2 { fill:#2b1100; stroke:#ea580c; stroke-width:1.5; animation:strobe-orange 2.4s ease-in-out infinite 0.8s; }
      .n3 { fill:#052e16; stroke:#15803d; stroke-width:1.5; animation:strobe-green  2.4s ease-in-out infinite 1.2s; }
      .n4 { fill:#2d0d0d; stroke:#dc2626; stroke-width:1.5; animation:strobe-red    2.4s ease-in-out infinite 1.6s; }
      .n5 { fill:#002028; stroke:#0e7490; stroke-width:1.5; animation:strobe-teal   2.4s ease-in-out infinite 2.0s; }

      text { font-family:'Courier New', Courier, monospace; }
    </style>

    <!-- Arrowheads -->
    <marker id="a"  markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0,0 7,2.5 0,5" fill="#4b5563"/></marker>
    <marker id="ar" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0,0 7,2.5 0,5" fill="#dc2626"/></marker>
    <marker id="ao" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0,0 7,2.5 0,5" fill="#ea580c"/></marker>
    <marker id="at" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0,0 7,2.5 0,5" fill="#0e7490"/></marker>

    <!-- Dot pattern for background -->
    <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="0.8" fill="#21262d"/>
    </pattern>

    <!-- Main flow path (for animated dots) -->
    <path id="mp" d="M380,120 L380,595"/>
    <!-- HITL branch path -->
    <path id="hp" d="M400,448 L558,448"/>
  </defs>

  <!-- Background -->
  <rect width="760" height="700" fill="#0d1117" rx="12"/>
  <rect width="760" height="700" fill="url(#dots)" rx="12"/>

  <!-- ═══ TITLE ═══ -->
  <text x="380" y="30" fill="#e6edf3" font-size="15" font-weight="bold" text-anchor="middle">OmniResolve-AI — Pipeline Multi-Agent</text>
  <text x="380" y="47" fill="#6e7681" font-size="10" text-anchor="middle">Otomatisasi resolusi komplain pelanggan · e-commerce Qhomemart</text>

  <!-- ═══ NODE 0: Customer (y=55..120) ═══ -->
  <rect x="222" y="55" width="316" height="65" rx="8" class="n0"/>
  <text x="380" y="77" fill="#60a5fa" font-size="10.5" font-weight="bold" text-anchor="middle">PELANGGAN (TELEGRAM BOT)</text>
  <text x="380" y="94" fill="#9ca3af" font-size="9" text-anchor="middle">Input: teks keluhan bebas + foto bukti kerusakan</text>
  <text x="380" y="110" fill="#4b5563" font-size="8.5" text-anchor="middle">Webhook / Polling  ·  ConversationStep state machine</text>

  <!-- Arrow 0→1 -->
  <line x1="380" y1="120" x2="380" y2="148" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- ═══ NODE 1: Liaison Agent (y=150..215) ═══ -->
  <rect x="207" y="150" width="346" height="65" rx="8" class="n1"/>
  <text x="380" y="172" fill="#a78bfa" font-size="10.5" font-weight="bold" text-anchor="middle">[A] LIAISON AGENT</text>
  <text x="380" y="189" fill="#9ca3af" font-size="9" text-anchor="middle">Ekstrak: order_id · nama pelanggan · deskripsi keluhan</text>
  <text x="380" y="205" fill="#4b5563" font-size="8.5" text-anchor="middle">Sentiment analysis · entity extraction · RAG: faq_patterns</text>

  <!-- Arrow 1→2 -->
  <line x1="380" y1="215" x2="380" y2="243" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- ═══ NODE 2: Logistics Auditor (y=245..325) ═══ -->
  <rect x="197" y="245" width="366" height="80" rx="8" class="n2"/>
  <text x="380" y="267" fill="#fb923c" font-size="10.5" font-weight="bold" text-anchor="middle">[B] LOGISTICS AUDITOR</text>
  <text x="380" y="284" fill="#9ca3af" font-size="9" text-anchor="middle">Verifikasi: kondisi gudang · status kurir · delivery log</text>
  <text x="380" y="300" fill="#6b7280" font-size="8.5" text-anchor="middle">Cross-check: damaged_at_pickup · damage_by_courier</text>
  <text x="380" y="315" fill="#4b5563" font-size="8.5" text-anchor="middle">RAG: resolved_cases  ·  self-correction retry loop</text>

  <!-- Retry self-loop -->
  <path d="M563,265 Q638,265 638,285 Q638,305 563,305"
        stroke="#ea580c" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#ao)"/>
  <text x="645" y="272" fill="#ea580c" font-size="7.5">retry</text>
  <text x="645" y="283" fill="#ea580c" font-size="7.5">if insuf.</text>
  <text x="645" y="294" fill="#ea580c" font-size="7.5">data</text>

  <!-- Arrow 2→3 -->
  <line x1="380" y1="325" x2="380" y2="353" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- ═══ NODE 3: Strategic Negotiator (y=355..420) ═══ -->
  <rect x="197" y="355" width="366" height="65" rx="8" class="n3"/>
  <text x="380" y="377" fill="#4ade80" font-size="10.5" font-weight="bold" text-anchor="middle">[C] STRATEGIC NEGOTIATOR</text>
  <text x="380" y="394" fill="#9ca3af" font-size="9" text-anchor="middle">CLV-based decision: replacement · voucher · refund · reject</text>
  <text x="380" y="410" fill="#4b5563" font-size="8.5" text-anchor="middle">Prioritas loyal customer · RAG: sop_policies + resolved_cases</text>

  <!-- Connector to diamond -->
  <line x1="380" y1="420" x2="380" y2="435" stroke="#374151" stroke-width="1.5"/>

  <!-- Decision diamond: center=(380,448) -->
  <polygon points="380,435 403,448 380,461 357,448" fill="#161b22" stroke="#4b5563" stroke-width="1.5"/>
  <text x="380" y="451.5" fill="#6e7681" font-size="7.5" text-anchor="middle">nilai?</text>

  <!-- HITL branch (right, red dashed) -->
  <line x1="403" y1="448" x2="558" y2="448" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ar)"/>
  <text x="481" y="441" fill="#dc2626" font-size="8.5" text-anchor="middle">&gt; Rp 1.000.000</text>

  <!-- ═══ NODE 4: HITL (x=560..720, y=425..500) ═══ -->
  <rect x="560" y="425" width="158" height="75" rx="8" class="n4"/>
  <text x="639" y="447" fill="#f87171" font-size="10.5" font-weight="bold" text-anchor="middle">HITL</text>
  <text x="639" y="463" fill="#fca5a5" font-size="9" text-anchor="middle">Supervisor approval</text>
  <text x="639" y="478" fill="#fca5a5" font-size="9" text-anchor="middle">Email + Telegram DM</text>
  <text x="639" y="493" fill="#7f1d1d" font-size="8.5" text-anchor="middle">END (manual review)</text>

  <!-- Main flow: diamond bottom → Orchestrator -->
  <line x1="380" y1="461" x2="380" y2="489" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="353" y="477" fill="#6e7681" font-size="8" text-anchor="end">≤ Rp 1jt</text>

  <!-- ═══ NODE 5: Supply Chain Orchestrator (y=491..564) ═══ -->
  <rect x="197" y="491" width="366" height="73" rx="8" class="n5"/>
  <text x="380" y="513" fill="#22d3ee" font-size="10.5" font-weight="bold" text-anchor="middle">[D] SUPPLY CHAIN ORCHESTRATOR</text>
  <text x="380" y="530" fill="#9ca3af" font-size="9" text-anchor="middle">Eksekusi: notifikasi gudang + kurir via Telegram group</text>
  <text x="380" y="546" fill="#6b7280" font-size="8.5" text-anchor="middle">Replacement PO · dispatch kurir · kirim voucher</text>
  <text x="380" y="561" fill="#4b5563" font-size="8.5" text-anchor="middle">RAG: auto-feedback → ingest kasus ke knowledge base</text>

  <!-- Arrow 5→END -->
  <line x1="380" y1="564" x2="380" y2="593" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- END Node -->
  <rect x="318" y="595" width="124" height="38" rx="19" fill="#161b22" stroke="#374151" stroke-width="1.5"/>
  <text x="380" y="619" fill="#e6edf3" font-size="12" font-weight="bold" text-anchor="middle">SELESAI</text>

  <!-- RAG feedback loop (left side, teal dashed) -->
  <path d="M197,527 Q72,527 72,408 Q72,290 197,290"
        stroke="#2dd4bf" stroke-width="1" fill="none" stroke-dasharray="3,5" opacity="0.4"
        marker-end="url(#at)"/>
  <text x="55" y="402" fill="#2dd4bf" font-size="7.5" text-anchor="middle" opacity="0.6">RAG</text>
  <text x="55" y="413" fill="#2dd4bf" font-size="7.5" text-anchor="middle" opacity="0.6">feed</text>
  <text x="55" y="424" fill="#2dd4bf" font-size="7.5" text-anchor="middle" opacity="0.6">back</text>

  <!-- ═══ ANIMATED DOTS ═══ -->
  <!-- Primary dot: moves along main vertical path -->
  <circle r="5" fill="#3b82f6">
    <animateMotion dur="6s" repeatCount="indefinite" begin="0s" calcMode="linear">
      <mpath xlink:href="#mp" href="#mp"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;1;1;1;0" keyTimes="0;0.05;0.88;0.95;1" dur="6s" repeatCount="indefinite" begin="0s"/>
  </circle>

  <!-- Secondary dot: staggered 3s behind -->
  <circle r="4" fill="#60a5fa">
    <animateMotion dur="6s" repeatCount="indefinite" begin="3s" calcMode="linear">
      <mpath xlink:href="#mp" href="#mp"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;0.8;0.8;0.8;0" keyTimes="0;0.05;0.88;0.95;1" dur="6s" repeatCount="indefinite" begin="3s"/>
  </circle>

  <!-- HITL branch dot: red, occasional -->
  <circle r="4" fill="#ef4444">
    <animateMotion dur="12s" repeatCount="indefinite" begin="4s" calcMode="linear">
      <mpath xlink:href="#hp" href="#hp"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.06;0.94;1" dur="12s" repeatCount="indefinite" begin="4s"/>
  </circle>

  <!-- ═══ LEGEND ═══ -->
  <rect x="14" y="648" width="732" height="42" rx="6" fill="#161b22" stroke="#21262d" stroke-width="1"/>

  <rect x="28" y="658" width="9" height="9" rx="2" fill="#7c3aed"/>
  <text x="41" y="667" fill="#a78bfa" font-size="8.5">faq_patterns (Liaison)</text>

  <rect x="162" y="658" width="9" height="9" rx="2" fill="#ea580c"/>
  <text x="175" y="667" fill="#fb923c" font-size="8.5">resolved_cases (Auditor · Nego · Orch)</text>

  <rect x="368" y="658" width="9" height="9" rx="2" fill="#15803d"/>
  <text x="381" y="667" fill="#4ade80" font-size="8.5">sop_policies (Negotiator)</text>

  <rect x="520" y="658" width="9" height="9" rx="2" fill="#dc2626"/>
  <text x="533" y="667" fill="#f87171" font-size="8.5">HITL &gt; Rp 1jt</text>

  <text x="636" y="667" fill="#2dd4bf" font-size="8.5">--- RAG feedback</text>

  <text x="380" y="683" fill="#4b5563" font-size="7.5" text-anchor="middle">
    LangGraph  ·  SumoPod API (Claude Haiku)  ·  PostgreSQL 16 + pgvector  ·  python-telegram-bot v21
  </text>
</svg>
